<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loisy's Space</title>
    <link rel="icon" href="res/loisy1.webp" type="image/webp">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-text">
                    <p class="eyebrow">Welcome to my space</p>
                    <h1>Loisy</h1>
                    <p class="subtitle">Code / Rhythm / Blocks</p>
                    
                    <div class="skills">
                        <span class="skill-tag">Java</span>
                        <span class="skill-tag">C Lang</span>
                        <span class="skill-tag">Python</span>
                        <span class="skill-tag">Embedded</span>
                    </div>

                    <div class="social-links">
                        <a href="https://github.com/Loisy233" target="_blank" class="social-btn" aria-label="GitHub">
                            <i class="fa-brands fa-github"></i>
                        </a>
                        <a href="https://space.bilibili.com/233319653" target="_blank" class="social-btn" aria-label="Bilibili">
                            <i class="fa-brands fa-bilibili"></i>
                        </a>
                        <a href="https://www.youtube.com/@Loisy_uwu" target="_blank" class="social-btn" aria-label="YouTube">
                            <i class="fa-brands fa-youtube"></i>
                        </a>
                        <a href="https://qm.qq.com/q/odvAcfIkla" target="_blank" class="social-btn" aria-label="QQ Group">
                            <i class="fa-brands fa-qq"></i>
                        </a>
                    </div>
                </div>
                <div class="hero-image">
                    <img src="res/Loisy-Body.webp" alt="Loisy Virtual Avatar" class="avatar">
                </div>
            </div>
        </section>

        <!-- Games Section -->
        <section class="games-section">
            <p class="eyebrow">What I Play</p>
            <h2>Games</h2>
            
            <div class="games-grid">
                <!-- Minecraft Card -->
                <div class="game-card">
                    <div class="card-header">
                        <i class="fa-solid fa-cube"></i>
                        <h3>Minecraft</h3>
                    </div>
                    <div class="mc-accounts">
                        <div class="mc-account">
                            <div class="mc-skin">
                                <img src="" alt="LoisyLoveLife Minecraft Skin" id="minecraft-skin-image-1">
                            </div>
                            <span class="mc-name">LoisyLoveLife</span>
                        </div>
                        <div class="mc-account">
                            <div class="mc-skin">
                                <img src="" alt="LoisyNotFound Minecraft Skin" id="minecraft-skin-image-2">
                            </div>
                            <span class="mc-name">LoisyNotFound</span>
                        </div>
                    </div>
                </div>

                <!-- osu! Card -->
                <div class="game-card">
                    <div class="card-header">
                        <i class="fa-solid fa-circle-notch"></i>
                        <h3>osu!</h3>
                    </div>
                    <div class="osu-content">
                        <a href="https://osu.ppy.sh/users/20348402" target="_blank">
                            <img src="https://osu-sig.vercel.app/card?user=20348402&mode=std&lang=en&animation=true" alt="osu! Status" loading="lazy">
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <span class="copyright">&copy; 2026 Loisy. Hosted on GitHub Pages.</span>
                <div class="assist">
                    <span>Assisted by</span>
                    <a href="https://gemini.google.com" target="_blank" class="gemini-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" alt="Gemini Logo" class="gemini-logo">
                    </a>
                </div>
            </div>
        </footer>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
